---
name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan.neon.dist'
      - 'phpstan-bootstrap.php'
      - 'languages/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan.neon.dist'
      - 'phpstan-bootstrap.php'
      - 'languages/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: oszuidwest/.github-templates/.github/workflows/wp-ci.yml@v3
