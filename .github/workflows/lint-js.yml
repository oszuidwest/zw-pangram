---
name: JS Lint

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.github/workflows/lint-js.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.github/workflows/lint-js.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: oszuidwest/.github-templates/.github/workflows/wp-js-ci.yml@v3
